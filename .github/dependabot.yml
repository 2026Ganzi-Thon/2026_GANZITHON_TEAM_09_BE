version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
      test:
        patterns: ["org.junit*", "org.testcontainers*", "com.tngtech.archunit*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul

  # Dockerfile·compose.prod.yaml의 이미지 태그(temurin, caddy, postgres)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
