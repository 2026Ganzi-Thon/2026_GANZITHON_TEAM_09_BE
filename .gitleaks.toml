# gitleaks 기본 규칙에 행운핑 비밀값 이름을 더한다.
[extend]
useDefault = true

[[rules]]
id = "haengunping-env-secret"
description = "행운핑 .env 비밀값이 코드에 들어감"
# 값 자리에 [ \t]만 쓴다. \s는 줄바꿈을 넘어 빈 값 다음 줄(VAPID_SUBJECT=...)을 값으로 읽는다(2026-11-17 오탐).
regex = '''(?i)(DATA_GO_KR_KEY|VAPID_PRIVATE_KEY|DB_PASSWORD)[ \t]*[:=][ \t]*['"]?[A-Za-z0-9+/=_\-%]{8,}'''
keywords = ["data_go_kr_key", "vapid_private_key", "db_password"]

[allowlist]
description = "예시 파일, 테스트용 가짜 키"
# WebPushCryptoTest.java: 웹 푸시 암호화 테스트에 고정된 가짜 VAPID 키가 들어간다(B, NOTI). 실제 키는 .env에만.
paths = [
  '''\.env\.example$''',
  '''(^|/)WebPushCryptoTest\.java$''',
]
