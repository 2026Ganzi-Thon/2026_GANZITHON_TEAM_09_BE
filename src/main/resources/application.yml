# 공통 설정. 비밀값은 환경변수(.env)로만 받는다. 값 자체를 이 파일에 쓰지 않는다.
spring:
  application:
    name: haengunping
  config:
    # 로컬에서는 레포 루트의 .env를 읽는다(없으면 건너뜀). 서버는 환경변수로 넣는다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/haengunping}
    username: ${DB_USERNAME:haengunping}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        # SEC-11: PostgreSQL은 제약 위반 때 "Failing row contains (...)"로 행 전체(기분 같은 민감정보 포함)를
        # 오류 세부 정보에 담고, 드라이버가 그걸 예외 메시지에 붙여 Hibernate·500 로그로 남는다.
        # 끄면 "어느 제약을 어겼는지"까지만 남는다(SensitiveLogTest).
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    datatype:
      enum:
        # SEC-05: 열거값 자리의 숫자를 순서(ordinal)로 받지 않는다. 기본값이면 {"mood":3}이 TIRED로 저장된다.
        fail-on-numbers-for-enums: true
    deserialization:
      # CHK-02: 정수 자리의 소수를 잘라 받지 않는다. 기본값이면 {"answers":[2.5,0,0,0]}이 [2,0,0,0]으로 판정된다.
      accept-float-as-int: false

server:
  error:
    # SEC-12: 기본 에러 응답에 내부 정보를 싣지 않는다.
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false
  forward-headers-strategy: native

haengunping:
  cookie-secure: ${COOKIE_SECURE:true}
  # 세션 쿠키 이름(D-11). __Host- 접두사는 브라우저가 Secure·경로 /·도메인 없음을 강제한다.
  # account 모듈의 세션 필터(담당 A)가 이 값을 읽는다.
  session-cookie-name: __Host-hp_session
  jobs:
    # RUNNING인 채로 이 시간이 지나면 서버가 죽은 실행으로 보고 다시 실행한다(common.job.JobRuns).
    stale-after: PT1H
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}
