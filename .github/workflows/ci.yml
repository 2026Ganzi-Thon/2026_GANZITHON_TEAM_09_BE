name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 코드가 그대로여도 새 취약점이 공개되므로 주 1회 다시 검사한다(월요일 09:00 KST).
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  # SEC-10: 공개 레포라 커밋 이력 전체에서 비밀값을 찾는다.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact -v

  # 빌드·테스트·커버리지. Gradle 뼈대(gradlew)가 생기기 전에는 각 단계를 건너뛴다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gradle 뼈대 확인
        id: gradle
        run: echo "exists=$( [ -f gradlew ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.gradle.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.gradle.outputs.exists == 'true'
      - name: 테스트 + 커버리지 (Testcontainers는 러너의 Docker 사용)
        if: steps.gradle.outputs.exists == 'true'
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon
      - name: 테스트 리포트 올리기
        if: always() && steps.gradle.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html

  # SEC-14: 잠금 파일(gradle.lockfile)의 모든 의존성을 OSV 취약점 DB와 대조한다. 하나라도 있으면 실패.
  # 레포 관리자 설정(Dependency graph) 없이 돈다. 이미지는 태그와 다이제스트로 고정한다.
  # 잠금 파일이 실제 빌드와 다르면 test 작업의 Gradle이 먼저 실패하므로, 여기서 보는 목록이 곧 실제 의존성이다.
  # 예외가 필요하면 osv-scanner.toml에 이유와 기한을 적는다(docs/ai-usage.md 3절).
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 \
            scan source -L gradle.lockfile:/src/gradle.lockfile
